<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --ground:    #070A08;
    --panel:     #0D120F;
    --panel-2:   #111814;
    --line:      #1D2721;
    --line-soft: #151D18;
    --ink:       #C4D2C6;
    --ink-dim:   #7C8C80;
    --ink-faint: #55645A;
    --phosphor:  #4FE88A;
    --phosphor-d:#2E9459;
    --amber:     #E8B54F;
    --ember:     #E0614F;

    --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, "Segoe UI Variable Text", "Segoe UI", system-ui, "Helvetica Neue", sans-serif;

    --step--1: 0.6875rem;
    --step-0:  0.8125rem;
    --step-1:  0.9375rem;
    --step-2:  1.125rem;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: var(--step-0);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    background: repeating-linear-gradient(
      to bottom,
      rgba(79, 232, 138, 0.022) 0 1px,
      transparent 1px 3px
    );
  }

  .shell {
    display: grid;
    grid-template-columns: 13.5rem minmax(0, 1fr);
    min-height: 100vh;
  }

  /* ---------------- left rail ---------------- */

  .rail {
    border-right: 1px solid var(--line);
    padding: 1.5rem 0;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    position: sticky;
    top: 0;
    align-self: start;
    max-height: 100vh;
  }

  .wordmark { padding: 0 1.25rem; display: flex; flex-direction: column; gap: 0.15rem; }
  .wordmark b {
    font-family: var(--mono);
    font-size: var(--step-1);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .wordmark span {
    font-family: var(--mono);
    font-size: var(--step--1);
    letter-spacing: 0.1em;
    color: var(--ink-faint);
  }

  .pages { display: flex; flex-direction: column; }
  .pages a {
    appearance: none;
    background: none;
    border: 0;
    border-left: 2px solid transparent;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: var(--step-0);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: left;
    text-decoration: none;
    padding: 0.55rem 1.25rem 0.55rem calc(1.25rem - 2px);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    align-items: baseline;
  }
  .pages a:hover { color: var(--ink); background: var(--line-soft); }
  .pages a:focus-visible { outline: 1px solid var(--phosphor); outline-offset: -1px; }
  .pages a[aria-current="page"] {
    color: var(--phosphor);
    border-left-color: var(--phosphor);
    background: var(--line-soft);
  }
  .pages .n { font-variant-numeric: tabular-nums; font-size: var(--step--1); color: var(--ink-faint); }
  .pages a[aria-current="page"] .n { color: var(--phosphor-d); }

  .machine {
    margin-top: auto;
    padding: 0 1.25rem;
    font-family: var(--mono);
    font-size: var(--step--1);
    line-height: 1.7;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }
  .machine b { color: var(--ink-dim); font-weight: 500; }

  /* ---------------- status rail ---------------- */

  main { min-width: 0; padding-bottom: 4rem; }

  .statusrail { border-bottom: 1px solid var(--line); }

  .statusrail .top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 19rem);
  }
  .runbox, .meters { padding: 1.15rem 1.5rem; min-width: 0; }
  .meters { border-left: 1px solid var(--line); }

  .eyebrow {
    font-family: var(--mono);
    font-size: var(--step--1);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .eyebrow .tally { margin-left: auto; letter-spacing: 0.08em; }
  .eyebrow .tally b { color: var(--phosphor-d); font-weight: 500; }

  .live-dot {
    width: 0.45rem; height: 0.45rem;
    border-radius: 50%;
    background: var(--phosphor);
    animation: pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(79, 232, 138, 0.5); }
    70%  { box-shadow: 0 0 0 0.5rem rgba(79, 232, 138, 0); }
    100% { box-shadow: 0 0 0 0 rgba(79, 232, 138, 0); }
  }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }

  .runline {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0 1.1rem;
    font-family: var(--mono);
    font-size: var(--step-0);
  }
  .runline .card-id { color: var(--phosphor); font-size: var(--step-1); }
  .runline dl { display: contents; margin: 0; }
  .runline dt {
    color: var(--ink-faint);
    font-size: var(--step--1);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .runline dd { margin: 0 0.6rem 0 -0.75rem; font-variant-numeric: tabular-nums; }

  .phases {
    margin-top: 0.85rem;
    display: flex;
    font-family: var(--mono);
    font-size: var(--step--1);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    flex-wrap: wrap;
  }
  .phase { padding: 0.15rem 0.6rem; color: var(--ink-faint); border: 1px solid var(--line); border-right-width: 0; }
  .phase:last-child { border-right-width: 1px; }
  .phase.done { color: var(--phosphor-d); }
  .phase.now { color: var(--ground); background: var(--phosphor); border-color: var(--phosphor); font-weight: 600; }

  .tallyline {
    margin: 0.8rem 0 0;
    display: flex;
    align-items: center;
    gap: 0.85rem;
    font-family: var(--mono);
    font-size: var(--step--1);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .tallyline b { color: var(--phosphor-d); font-weight: 500; font-variant-numeric: tabular-nums; }

  /* What the panel itself started in the background. A line per command, under
     the run it may or may not be part of — `ingest` and `preflight` are nobody's
     night, and before this block existed they had nowhere on the page to be. */
  .jobs { margin-top: 0.8rem; display: flex; flex-direction: column; gap: 0.3rem; }
  .jobline {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--mono);
    font-size: var(--step--1);
  }
  .jobline .dim { color: var(--ink-faint); }
  .jobline .act { padding: 0.05rem 0.4rem; }

  .roster { padding: 0.4rem 1.5rem 1.2rem; overflow-x: auto; }
  .roster table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: var(--step-0);
  }
  .roster td {
    padding: 0.32rem 0.9rem 0.32rem 0;
    vertical-align: baseline;
    white-space: nowrap;
  }
  .roster td.card { color: var(--ink); white-space: normal; min-width: 12rem; }
  .roster td.mark { width: 1.1rem; padding-right: 0.5rem; }
  .roster td.num { font-variant-numeric: tabular-nums; color: var(--ink-dim); text-align: right; }
  .roster td.said { color: var(--ink-faint); white-space: normal; max-width: 34rem; }
  .roster tr.pend td { color: var(--ink-faint); }
  /* A job's own output, under its row — the answer to "how far are we", on the
     page you are already looking at rather than behind a link. */
  .roster tr.joblog td { white-space: normal; padding: 0 0 0.7rem; }
  .roster tr.joblog pre {
    margin: 0;
    padding: 0.5rem 0.7rem;
    background: var(--panel-2);
    border-left: 2px solid var(--line);
    color: var(--ink-dim);
    font-size: var(--step--1);
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-x: auto;
  }
  .roster tr.now td.card { color: var(--phosphor); }
  .m-ok   { color: var(--phosphor); }
  .m-bad  { color: var(--ember); }
  .m-now  { color: var(--amber); }
  .m-wait { color: var(--ink-faint); }
  .lane { color: var(--ink-dim); }

  /* meters */

  .meter { margin-bottom: 0.6rem; }
  .meter:last-of-type { margin-bottom: 0; }
  .meter-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--mono);
    font-size: var(--step--1);
    letter-spacing: 0.08em;
    margin-bottom: 0.25rem;
  }
  .meter-head span:first-child { color: var(--ink-dim); text-transform: uppercase; }
  .meter-head span:last-child { font-variant-numeric: tabular-nums; }
  .track { height: 3px; background: var(--line); position: relative; overflow: hidden; }
  .track i { position: absolute; inset: 0 auto 0 0; background: var(--phosphor); }
  .track i.warn { background: var(--amber); }
  .track i.bad { background: var(--ember); }
  .resets {
    font-family: var(--mono);
    font-size: var(--step--1);
    color: var(--ink-faint);
    margin: 0.15rem 0 0;
    font-variant-numeric: tabular-nums;
  }
  .spend { margin-top: 0.85rem; padding-top: 0.7rem; border-top: 1px solid var(--line-soft); }
  .spend .acts { margin-top: 0.5rem; justify-content: flex-start; }
  .account { margin-top: 0.5rem; font-family: var(--mono); font-size: var(--step--1); color: var(--ink-faint); }
  .account b { color: var(--ink-dim); font-weight: 500; }
  .account select {
    background: var(--ground); color: var(--ink); border: 1px solid var(--line);
    font-family: var(--mono); font-size: var(--step--1); padding: 0.1rem 0.2rem; margin-top: 0.3rem;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-family: var(--mono);
    font-size: var(--step--1);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.12rem 0.45rem;
    border: 1px solid currentColor;
    white-space: nowrap;
  }
  .chip.warn { color: var(--amber); }
  .chip.ok   { color: var(--phosphor-d); }
  .chip.mute { color: var(--ink-faint); }
  .chip.bad  { color: var(--ember); }

  /* ---------------- sections ---------------- */

  section { border-bottom: 1px solid var(--line); }

  .sec-head { display: flex; align-items: baseline; gap: 0.75rem; padding: 1.3rem 1.5rem 0.55rem; }
  .sec-head h2 {
    margin: 0;
    font-family: var(--mono);
    font-size: var(--step-1);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .sec-head .count { font-family: var(--mono); color: var(--phosphor-d); font-variant-numeric: tabular-nums; }
  .sec-head .note {
    margin-left: auto;
    font-size: var(--step--1);
    color: var(--ink-faint);
    text-align: right;
    max-width: 26rem;
  }
  .sec-sub { margin: 0; padding: 0 1.5rem 0.8rem; color: var(--ink-dim); max-width: 62ch; }

  .rows { border-top: 1px solid var(--line-soft); }

  .row {
    display: grid;
    grid-template-columns: auto auto 1.4rem minmax(0, 1fr) auto;
    gap: 0 0.75rem;
    align-items: start;
    padding: 0.7rem 1.5rem;
    border-bottom: 1px solid var(--line-soft);
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--panel); }
  /* The dragged row is itself the indicator, outlined top and bottom where it
     currently sits — see the `dragover` handler for why there is no separate
     insertion line any more. */
  .row.dragging {
    opacity: 0.55;
    background: var(--panel);
    box-shadow: inset 0 2px 0 0 var(--phosphor), inset 0 -2px 0 0 var(--phosphor);
  }

  .grip {
    font-family: var(--mono);
    color: var(--ink-faint);
    cursor: grab;
    padding-top: 0.05rem;
    user-select: none;
    line-height: 1.2;
  }
  .grip:hover { color: var(--phosphor); }
  .row.no-grip .grip { visibility: hidden; cursor: default; }

  .pick, .tick { margin: 0.25rem 0 0; width: 0.85rem; height: 0.85rem; accent-color: var(--phosphor); cursor: pointer; }

  .marker {
    font-family: var(--mono);
    color: var(--ink-faint);
    padding-top: 0.05rem;
    font-variant-numeric: tabular-nums;
  }

  .body { min-width: 0; }
  .id { font-family: var(--mono); color: var(--phosphor); word-break: break-word; }
  .title { display: block; margin-top: 0.1rem; }
  .meta {
    margin-top: 0.28rem;
    font-family: var(--mono);
    font-size: var(--step--1);
    color: var(--ink-faint);
    letter-spacing: 0.05em;
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 0.9rem;
    align-items: center;
  }
  .why { margin: 0.28rem 0 0; color: var(--ink-dim); max-width: 62ch; }

  .acts { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }

  .act {
    appearance: none;
    font-family: var(--mono);
    font-size: var(--step--1);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: none;
    border: 1px solid var(--line);
    padding: 0.22rem 0.6rem;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    display: inline-block;
  }
  .act:hover { color: var(--phosphor); border-color: var(--phosphor-d); background: var(--panel-2); }
  .act:focus-visible { outline: 1px solid var(--phosphor); outline-offset: 1px; }
  .act.primary { color: var(--phosphor); border-color: var(--phosphor-d); }
  .act.primary:hover { background: var(--phosphor); color: var(--ground); }
  .act[disabled] { color: var(--ink-faint); border-color: var(--line-soft); cursor: not-allowed; }
  .act[disabled]:hover { background: none; color: var(--ink-faint); border-color: var(--line-soft); }
  .act.gone { color: var(--phosphor-d); border-color: var(--line-soft); cursor: default; }
  .act.gone:hover { background: none; border-color: var(--line-soft); }

  .barbox {
    display: flex;
    align-items: center;
    gap: 1rem 1.25rem;
    flex-wrap: wrap;
    padding: 0.9rem 1.5rem;
    border-top: 1px solid var(--line-soft);
    background: var(--panel);
  }
  .barbox p { margin: 0; color: var(--ink-dim); max-width: 44ch; }
  .barbox .acts { margin-left: auto; }

  .takefirst {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-family: var(--mono);
    font-size: var(--step--1);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .takefirst input[type="range"] { width: 7rem; accent-color: var(--phosphor); }
  .takefirst output { color: var(--phosphor); font-variant-numeric: tabular-nums; min-width: 1.1rem; }

  .override {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: var(--mono);
    font-size: var(--step--1);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--amber);
    cursor: pointer;
  }
  .override input { accent-color: var(--amber); margin: 0; }
  /* The tier override changes which model a session opens on. Amber is reserved
     for the one tick that waives a spending rule; this one costs less, not more. */
  .override.soft { color: var(--ink-dim); }
  .override.soft input { accent-color: var(--phosphor); }

  .group-label {
    font-family: var(--mono);
    font-size: var(--step--1);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 0.9rem 1.5rem 0.35rem;
    border-top: 1px solid var(--line-soft);
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
  }
  .group-label::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
  .rows .group-label:first-child { border-top: 0; }

  .flag {
    margin: 0 1.5rem 1.2rem;
    border: 1px solid var(--amber);
    border-left-width: 3px;
    padding: 0.8rem 1rem;
    background: rgba(232, 181, 79, 0.05);
  }
  .flag h3 {
    margin: 0 0 0.3rem;
    font-family: var(--mono);
    font-size: var(--step-0);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 600;
  }
  .flag p { margin: 0; color: var(--ink-dim); max-width: 64ch; }

  .empty { padding: 1.1rem 1.5rem 1.4rem; color: var(--ink-faint); }

  /* a card or a note, read rather than parsed */
  .doc { padding: 0.4rem 1.5rem 1.4rem; max-width: 78ch; }
  .fields {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 1.1rem;
    font-family: var(--mono);
    font-size: var(--step--1);
    color: var(--ink-dim);
    letter-spacing: 0.05em;
    padding: 0.6rem 0.8rem;
    margin-bottom: 0.6rem;
    border: 1px solid var(--line);
    background: var(--panel);
  }
  .fields b { color: var(--ink-faint); font-weight: 500; text-transform: uppercase; }
  .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 {
    font-family: var(--mono);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--phosphor);
    margin: 1.6rem 0 0.5rem;
    font-weight: 600;
  }
  .doc h2 { font-size: var(--step-1); border-bottom: 1px solid var(--line); padding-bottom: 0.3rem; }
  .doc h3 { font-size: var(--step-0); color: var(--ink); }
  .doc h4, .doc h5, .doc h6 { font-size: var(--step--1); color: var(--ink-dim); }
  .doc p { margin: 0.7rem 0; }
  .doc ul, .doc ol { margin: 0.7rem 0; padding-left: 1.4rem; }
  .doc ul { list-style: none; }
  .doc ol { list-style: decimal; }
  .doc li { padding: 0.12rem 0; border: 0; }
  .doc ul > li::before {
    content: "—";
    color: var(--phosphor-d);
    margin-left: -1.4rem;
    margin-right: 0.55rem;
  }
  .doc li:hover { background: none; }
  .doc code {
    color: var(--phosphor);
    background: var(--panel-2);
    padding: 0.05rem 0.3rem;
    border: 1px solid var(--line-soft);
  }
  .doc pre {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 2px solid var(--phosphor-d);
    padding: 0.8rem 1rem;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: var(--step--1);
    line-height: 1.6;
    color: var(--ink);
  }
  .doc blockquote {
    margin: 0.8rem 0;
    padding: 0.2rem 0 0.2rem 1rem;
    border-left: 2px solid var(--line);
    color: var(--ink-dim);
  }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 1.4rem 0; }
  .doc a { color: var(--phosphor); }
  .doc b { color: var(--ink); }
  .doc table { border-collapse: collapse; margin: 0.9rem 0; font-size: var(--step--1); }
  .doc th, .doc td {
    border: 1px solid var(--line);
    padding: 0.3rem 0.6rem;
    text-align: left;
    vertical-align: top;
  }
  .doc th { font-family: var(--mono); color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.08em; }

  /* The answering form. One block per sub-question, options stacked rather than
     inline: a real option is a whole sentence with its consequence attached, so a
     row of radio buttons would truncate exactly the part you are choosing between. */
  .decide-q { padding: 0.2rem 1.5rem 1rem; max-width: 78ch; }
  .decide-q h3 {
    font-family: var(--mono);
    font-size: var(--step-0);
    color: var(--ink-dim);
    font-weight: 600;
    margin: 0.9rem 0 0.5rem;
  }
  .pickone {
    display: flex;
    gap: 0.6rem;
    align-items: baseline;
    padding: 0.45rem 0.6rem;
    border: 1px solid transparent;
    line-height: 1.55;
    cursor: pointer;
  }
  .pickone:hover { border-color: var(--line); background: var(--ground); }
  .pickone input { margin-top: 0.25rem; flex: 0 0 auto; }
  .pickone span { flex: 1 1 auto; }
  .pickone .dim { color: var(--ink-faint); }
  .decide-q textarea {
    width: 100%;
    min-height: 6rem;
    background: var(--ground);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 0.6rem 0.7rem;
    font-family: var(--mono);
    font-size: var(--step-0);
    line-height: 1.6;
    resize: vertical;
  }
  .decide-q textarea:focus-visible { outline: 1px solid var(--phosphor); outline-offset: -1px; }

  .editor { padding: 0 1.5rem 1.1rem; display: none; }
  .editor.open { display: block; }
  .editor textarea {
    width: 100%;
    min-height: 5.5rem;
    background: var(--ground);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 0.6rem 0.7rem;
    font-family: var(--mono);
    font-size: var(--step-0);
    line-height: 1.6;
    resize: vertical;
  }
  .editor textarea:focus-visible { outline: 1px solid var(--phosphor); outline-offset: -1px; }
  .editor input[type="text"] {
    width: 100%;
    background: var(--ground);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 0.4rem 0.7rem;
    font-family: var(--mono);
    font-size: var(--step-0);
    margin-bottom: 0.5rem;
  }
  .editor .acts { margin-top: 0.6rem; justify-content: flex-start; }

  footer {
    padding: 1.5rem;
    color: var(--ink-faint);
    font-size: var(--step--1);
    font-family: var(--mono);
    letter-spacing: 0.05em;
    line-height: 1.8;
  }

  #toast {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    z-index: 200;
    max-width: 34rem;
    display: none;
    padding: 0.7rem 0.9rem;
    background: var(--panel-2);
    border: 1px solid var(--phosphor-d);
    color: var(--ink);
    font-family: var(--mono);
    font-size: var(--step--1);
    line-height: 1.6;
    white-space: pre-wrap;
  }
  #toast.bad { border-color: var(--ember); color: var(--ember); }

  /* Deliberately outside `.shell`, beside the toast: `applyRefresh` swaps the rail,
     the sections and the footer, and a countdown living in any of them would differ
     from the server's copy every single second — which would force a swap on every
     tick and undo the "identical -> do nothing" rule the whole refresh is built on. */
  #ticker {
    position: fixed;
    bottom: 1rem;
    left: 1rem;
    z-index: 200;
    padding: 0.3rem 0.55rem;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--ink-faint);
    font-family: var(--mono);
    font-size: var(--step--1);
    letter-spacing: 0.08em;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  #ticker:hover { color: var(--phosphor); border-color: var(--phosphor-d); }
  #ticker.now { color: var(--phosphor); }

  @media (max-width: 58rem) {
    .shell { grid-template-columns: 1fr; }
    .rail { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); gap: 1.2rem; }
    .pages { flex-direction: row; overflow-x: auto; }
    .pages a { border-left: 0; border-bottom: 2px solid transparent; }
    .pages a[aria-current="page"] { border-bottom-color: var(--phosphor); }
    .machine { margin-top: 0; }
    .statusrail .top { grid-template-columns: 1fr; }
    .roster { overflow-x: auto; }
    .row { grid-template-columns: auto auto 1.4rem minmax(0, 1fr); }
    .acts { grid-column: 1 / -1; justify-content: flex-start; margin-top: 0.5rem; }
  }
</style>
</head>
<body>
<div class="shell">
{{RAIL}}
  <main>
{{STATUSRAIL}}
{{CONTENT}}
  </main>
</div>
<div id="toast"></div>
<div id="ticker" hidden title="How long until this page re-reads the board. Click to do it now."></div>
<script>
/* Every action is a POST to a verb that already works from a command line; this
   file only decides which one and shows what it said. */

/* A verb's reply, shown until it has plausibly been read.

   It is dismissible because it is now allowed to be long-lived, and a message
   that cannot be got rid of is a message that covers the button underneath it. */
function toast(message, bad) {
  var el = document.getElementById("toast");
  el.textContent = message;
  el.className = bad ? "bad" : "";
  el.style.display = "block";
  el.onclick = function () { el.style.display = "none"; };
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function () { el.style.display = "none"; }, bad ? 20000 : 9000);
}

/* ---- a message has to survive the reload that follows it ----

   Every successful action reloads the page 900 ms later, so that the board it
   just changed is the board you are looking at. That reload used to destroy the
   only thing the panel ever said about the action: the toast was given five
   seconds and got nine hundred milliseconds, and "classifying the inbox (pid
   31904)" flashed and was gone. What made it worse than a cosmetic bug is which
   messages survived — a *refused* verb does not reload, so failures stayed on
   screen and successes did not, and the panel appeared to answer only when it
   had bad news.

   So the message is parked in sessionStorage and re-shown by the page that
   replaces this one. sessionStorage rather than a query parameter: it is not
   part of the address, so it does not survive a bookmark, a share or a manual
   refresh — the message belongs to this tab and this moment.

   **No longer the usual path.** Since the live refresh landed, a successful verb
   swaps the changed regions in place instead of reloading, so the toast is never
   destroyed and never needs carrying. This stays for the cases that still replace
   the document — a verb that navigates, and any future one that must — because the
   failure it fixes (the panel appearing to answer only when it has bad news) comes
   back the moment one of those exists without it. */
var TOAST_KEY = "ns_toast";

function toastAfterReload(message, bad) {
  try {
    sessionStorage.setItem(TOAST_KEY, JSON.stringify({ message: message, bad: !!bad }));
  } catch (err) { /* private mode, or a storage quota: the toast is not worth failing over */ }
}

(function showCarriedToast() {
  var raw = null;
  try {
    raw = sessionStorage.getItem(TOAST_KEY);
    sessionStorage.removeItem(TOAST_KEY);
  } catch (err) { return; }
  if (!raw) { return; }
  try {
    var carried = JSON.parse(raw);
    toast(carried.message, carried.bad);
  } catch (err) { /* nothing legible was parked; say nothing rather than something wrong */ }
})();

/* The override rides on every request rather than being remembered per button.
   It is a property of the moment, not of the action, and attaching it in the one
   place every action goes through is what stops a new button being added without
   it — the veto would then refuse and the tick beside the account would appear to
   do nothing. Verbs that do not spend simply ignore the key. */
function post(path, body, opts) {
  opts = opts || {};
  body = body || {};
  var override = document.getElementById("allowpaid");
  if (override && override.checked) { body.allow_paid = true; }
  return fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().then(function (data) { return { ok: r.ok, data: data }; });
  }).then(function (result) {
    var message = result.data.message || (result.ok ? "done" : "refused");
    toast(message, !result.ok);
    if (result.ok && opts.reload !== false) {
      /* Was `location.reload()`. The soft refresh shows the same changed board
         without throwing away the scroll position, the ticks or anything half-typed
         — and the toast survives on its own, because the page it is sitting on is
         never replaced. `toastAfterReload` is kept for the paths that still do
         reload the document; see its comment. */
      setTimeout(softRefresh, 400);
    }
    return result;
  }).catch(function (err) { toast(String(err), true); });
}

/* ---- uninstall: the one action that asks you to type something ----
   Every other control on the System page is either a report or something a further
   `update` can undo. This one removes the install, and takes the launcher and the
   manifest with it — so the panel stops answering the moment it succeeds. A typed
   project name is the cheapest confirmation that cannot be given by a stray click,
   and the server checks it too (`_system_verb`): the dialog is a courtesy, not the
   guard. */
function confirmUninstall(name) {
  var typed = window.prompt(
    "This removes nightshift from " + name + ", including the Command Center " +
    "launcher and the manifest — this page will stop working.\n\n" +
    "Type the project name to confirm:");
  if (typed === null) { return; }
  if (typed !== name) { toast("that is not " + name + " — nothing was removed", true); return; }
  post("/api/system/uninstall", { confirm: typed });
}

/* ---- drag to reorder, renumber, and persist kanban_order ---- */

function renumber(list) {
  var n = 0;
  list.querySelectorAll(":scope > .row").forEach(function (row) {
    if (row.classList.contains("no-grip")) { return; }
    n += 1;
    var marker = row.querySelector(".marker");
    if (marker) { marker.textContent = String(n); }
  });
}

/* `kanban_order` sorts lexicographically — that is what Obsidian's Bases writes
   and what board.dispatch_order reads. Fixed-width keys keep that true past ten
   rows, where "10" would otherwise sort between "1" and "2". */
function orderKey(index) {
  var s = String(index + 1);
  while (s.length < 4) { s = "0" + s; }
  return "V" + s;
}

function persistOrder(list) {
  var rows = [];
  list.querySelectorAll(":scope > .row").forEach(function (row) {
    if (!row.classList.contains("no-grip") && row.dataset.id) { rows.push(row.dataset.id); }
  });
  var writes = rows.map(function (id, i) {
    return { card_id: id, order: orderKey(i) };
  });
  post("/api/reorder-many", { writes: writes }, { reload: false }).then(function (r) {
    if (r && r.ok) { toast("order saved", false); }
  });
}

/* ---- delegated, and that is load-bearing ----

   These used to be bound per list: `document.querySelectorAll("#queue, #ideasrows")`
   at load, one set of listeners each. That was fine while the only way the DOM
   changed was a full page reload, which rebinds everything by construction. The live
   refresh replaces a section's HTML in place, and a replaced `#queue` is a *new*
   element with none of those listeners — so dragging would have gone on looking
   perfectly normal and silently stopped saving order, which is the worst shape a bug
   can take on a board whose whole job is remembering what you decided.

   Bound on `document` instead, matching on the way up. The listeners therefore
   survive any swap, because they were never attached to the thing being swapped.
   `held` lives out here for the same reason. */
var held = null;

function dragList(node) {
  return node ? node.closest("#queue, #ideasrows") : null;
}

document.addEventListener("dragstart", function (e) {
  var list = dragList(e.target);
  if (!list) { return; }
  var row = e.target.closest(".row");
  if (!row || row.classList.contains("no-grip")) { return; }
  held = row;
  row.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", "row");
});

document.addEventListener("dragend", function (e) {
  var list = dragList(held) || dragList(e.target);
  if (held) { held.classList.remove("dragging"); }
  if (!list) { held = null; return; }
  held = null;
  renumber(list);
  persistOrder(list);
});

/* ---- the row shows its own destination ----

   This drew a separate insertion line: `.drag-over` on the row under the cursor,
   styled `inset 0 2px 0 0` — a bar across that row's **top** edge, unconditionally.
   The insertion below is conditional: past the halfway mark the row is moved to
   *after* the target, not before it. So for every drop in the bottom half of a row
   the line was drawn one position above where the card actually went, and Karel
   read the line rather than the rows, which is what a line is for. Reported
   2026-08-19: "I see the green line at the right position ... but the card lands
   one position below that."

   The line is gone rather than corrected, because a second indicator was never
   needed. `insertBefore` already moves the real row on every `dragover`, so the
   destination is on screen as the thing that will be saved — `persistOrder` reads
   this same DOM order on `dragend`. Outlining that row (`.row.dragging`) therefore
   cannot disagree with the outcome: it *is* the outcome. A drawn line is a second
   claim about where the card will land, and a second claim is a thing that can be
   wrong.

   The early return on `over === held` is also load-bearing now. Once the row has
   been moved under the cursor, the next `dragover` often targets `held` itself;
   with a separate marker that left the old row lit and the line froze mid-drag,
   which is the other half of "sometimes the position is not clear". */
document.addEventListener("dragover", function (e) {
  if (!held) { return; }
  var list = dragList(held);
  if (!list || !list.contains(e.target)) { return; }
  e.preventDefault();
  var over = e.target.closest(".row");
  if (!over || over === held || over.classList.contains("no-grip")) { return; }
  var box = over.getBoundingClientRect();
  var after = (e.clientY - box.top) > box.height / 2;
  over.parentNode.insertBefore(held, after ? over.nextSibling : over);
});

document.addEventListener("drop", function (e) {
  if (dragList(e.target)) { e.preventDefault(); }
});

/* ---- one selection model, two ways to drive it ---- */

/* Looked up on every call rather than captured once, for the same reason the drag
   handlers are delegated: after a refresh has swapped the Tonight section, a list of
   checkbox elements captured at load points at nodes no longer in the document, and
   "Run the ticked" would faithfully send the ticks of a page that is gone. */
function pickBoxes() {
  var queue = document.getElementById("queue");
  return queue ? Array.prototype.slice.call(queue.querySelectorAll(".pick")) : [];
}

function pickedIds() {
  var ids = [];
  pickBoxes().forEach(function (p) { if (p.checked) { ids.push(p.dataset.id); } });
  return ids;
}

function countPicked() {
  var picks = pickBoxes();
  var pickedOut = document.getElementById("picked");
  var slider = document.getElementById("takefirst");
  var sliderOut = document.getElementById("takefirstout");
  var n = pickedIds().length;
  if (pickedOut) { pickedOut.textContent = n + " of " + picks.length; }
  if (slider && sliderOut) { slider.value = String(n); sliderOut.textContent = String(n); }
}

document.addEventListener("change", function (e) {
  if (e.target && e.target.classList && e.target.classList.contains("pick")) { countPicked(); }
});

document.addEventListener("input", function (e) {
  if (!e.target || e.target.id !== "takefirst") { return; }
  var picks = pickBoxes();
  var sliderOut = document.getElementById("takefirstout");
  var pickedOut = document.getElementById("picked");
  var take = Number(e.target.value);
  picks.forEach(function (p, i) { p.checked = i < take; });
  if (sliderOut) { sliderOut.textContent = String(take); }
  if (pickedOut) { pickedOut.textContent = take + " of " + picks.length; }
});

countPicked();

/* `post` attaches the override itself, so these say only what they are. */
function runTicked() {
  var ids = pickedIds();
  if (!ids.length) { toast("nothing ticked — tick a card, or drag the slider", true); return; }
  post("/api/night", { card_ids: ids });
}

function runNight() { post("/api/night", {}); }
function runChores() { post("/api/chores/run", {}); }

/* ---- verify: mark one OK now, or tick several and save ---- */

/* Looked up per call, and delegated — same reason as `pickBoxes` and the drag
   handlers: a refresh can replace the Play-through section under us. */
function tickBoxes() {
  return Array.prototype.slice.call(document.querySelectorAll(".tick"));
}
function countTicked() {
  var tickedOut = document.getElementById("ticked");
  var n = 0;
  tickBoxes().forEach(function (t) { if (t.checked && !t.disabled) { n += 1; } });
  if (!tickedOut) { return; }
  tickedOut.textContent = n === 0 ? "Nothing ticked." : (n === 1 ? "1 card ticked." : n + " cards ticked.");
}
document.addEventListener("change", function (e) {
  if (e.target && e.target.classList && e.target.classList.contains("tick")) { countTicked(); }
});
countTicked();

function markOK(button, cardId) {
  post("/api/verified", { card_id: cardId }, { reload: false }).then(function (r) {
    if (!r || !r.ok) { return; }
    var row = button.closest(".row");
    var tick = row ? row.querySelector(".tick") : null;
    if (tick) { tick.checked = true; tick.disabled = true; }
    button.textContent = "✓ done/";
    button.classList.remove("primary");
    button.classList.add("gone");
    button.disabled = true;
    countTicked();
  });
}

function saveTicked() {
  var ids = [];
  tickBoxes().forEach(function (t) { if (t.checked && !t.disabled) { ids.push(t.dataset.id); } });
  if (!ids.length) { toast("nothing ticked", true); return; }
  post("/api/verified-many", { card_ids: ids });
}

/* ---- inline editors ---- */

function openEditor(id) {
  var panel = document.getElementById("ed-" + id);
  if (!panel) { return; }
  panel.classList.add("open");
  var field = panel.querySelector("textarea");
  if (field) { field.focus(); }
}
function closeEditor(id) {
  var panel = document.getElementById("ed-" + id);
  if (panel) { panel.classList.remove("open"); }
}

/* The body is fetched on demand rather than inlined into every row, so a page
   that lists thirty notes does not carry thirty bodies it will never show. */
function editBody(slug, path) {
  var panel = document.getElementById("ed-" + slug);
  if (!panel) { return; }
  var field = panel.querySelector("textarea");
  panel.classList.add("open");
  if (field) {
    field.value = "loading…";
    fetch("/api/body?path=" + encodeURIComponent(path))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        field.value = data.body || "";
        field.focus();
      })
      .catch(function (err) { field.value = ""; toast(String(err), true); });
  }
}

function saveBody(slug, path) {
  var panel = document.getElementById("ed-" + slug);
  var field = panel ? panel.querySelector("textarea") : null;
  if (!field) { return; }
  post("/api/edit", { path: path, body: field.value });
}

function saveNew(slug, lane) {
  var panel = document.getElementById("ed-" + slug);
  if (!panel) { return; }
  var name = panel.querySelector("input[type=text]");
  var field = panel.querySelector("textarea");
  if (!name || !name.value.trim()) { toast("give it a filename first", true); return; }
  post("/api/note", { name: name.value.trim(), body: field ? field.value : "", lane: lane });
}

/* ---- answering a parked card ----

   Reads the ticked radio per sub-question, in document order, so `picks[i]` lines up
   with `decide.parse()[i]` on the server. An unticked group — or the deliberate
   "something else" option, which carries an empty value — sends "" for that slot, and
   the server records only the ones that were answered. A partial answer is a real
   thing: a card can batch three decisions and you may only be sure of two. */
function answerCard(cardId) {
  var groups = {};
  document.querySelectorAll('.decide-q input[type=radio]').forEach(function (r) {
    if (!(r.name in groups)) { groups[r.name] = ""; }
    if (r.checked) { groups[r.name] = r.value; }
  });
  var picks = Object.keys(groups).sort(function (a, b) {
    return Number(a.slice(1)) - Number(b.slice(1));
  }).map(function (k) { return groups[k]; });
  var note = document.getElementById("answernote");
  post("/api/answer", { card_id: cardId, picks: picks, note: note ? note.value : "" })
    .then(function (r) {
      /* Clear it only once the server has it: a cleared box after a refusal would
         throw away exactly the words that were hardest to write. */
      if (r && r.ok && note) { note.value = ""; }
    });
}

function sendToTasks(cardId) {
  post("/api/tasks", { card_id: cardId });
}

/* ---- the live refresh ----------------------------------------------------

   The panel reports on things that take minutes — a night, a chore batch, a
   classify pass — and until now it reported on them only when you pressed
   something. A page you have to reload to trust is a page you stop trusting: the
   meters were stale, the live-run section froze at whatever was true when you opened it,
   and a batch could finish, land and write its report with nothing on screen
   moving.

   **Nothing here reloads the page**, and that is the whole design rather than an
   optimisation. A reload is the one operation guaranteed to destroy every piece of
   work in progress on the page: the scroll position, the caret in a half-typed
   answer, the cards you have just unticked, a row mid-drag. So the server re-renders
   the page it already knows how to render, and the client replaces only the regions
   whose HTML actually differs — leaving anything you are touching alone.

   Three decisions per region, in order:

     identical  -> do nothing at all. The common case on a quiet board, and it means
                   an idle tab mutates no DOM and cannot flicker.
     busy       -> skip it, try again next tick. "Busy" is narrow on purpose: a drag
                   in flight, or the focus being inside it. Every *other* region still
                   updates, which is the point of doing this per region rather than
                   per page — editing an idea in place must not freeze the allowance
                   meters three inches away.
     otherwise  -> swap it, then put back the handful of things that are user state
                   rather than server state (see `carryState`).

   The regions are matched by id, so a section without one is simply never swapped.
   `_section(sec_id=...)` is where those come from. */

var REFRESH_MS = 10000;

/* User state that lives in the DOM and has no server-side truth to re-render from.
   Everything here is something you *did* to this page that the board does not know
   about yet, so a swap has to carry it across by hand. Kept deliberately short: if
   this list grows long it is a sign the page is holding state that belongs on disk. */
function carryState(oldRegion, newRegion) {
  /* The Tonight ticks and the paid-override, by the id the server already writes.

     `[data-server]` opts a control *out*, and the tier override is the first to
     need it. Carrying is right for a tick the board has never heard of — the
     server's re-render cannot know it — and exactly wrong for one that posted
     itself the moment it changed: the freshly rendered value is then the better
     answer, and copying the old one over it would make a second tab's swap quietly
     revert a choice made in the first. */
  oldRegion.querySelectorAll("input[type=checkbox]:not([data-server])").forEach(function (was) {
    var now = null;
    if (was.id) {
      now = newRegion.querySelector("#" + CSS.escape(was.id));
    } else if (was.dataset.id) {
      now = newRegion.querySelector(
        'input[type=checkbox][data-id="' + CSS.escape(was.dataset.id) + '"]');
    }
    if (now) { now.checked = was.checked; }
  });
  /* An editor the user has opened, and whatever they have typed into it. */
  oldRegion.querySelectorAll("textarea, input[type=text]").forEach(function (was) {
    if (!was.value) { return; }
    var holder = was.closest("[id]");
    if (!holder) { return; }
    var now = newRegion.querySelector("#" + CSS.escape(holder.id));
    var field = now ? now.querySelector(was.tagName.toLowerCase()) : null;
    if (field && !field.value) { field.value = was.value; }
  });
  oldRegion.querySelectorAll(".open[id]").forEach(function (was) {
    var now = newRegion.querySelector("#" + CSS.escape(was.id));
    if (now) { now.classList.add("open"); }
  });
}

/* Busy means **there is user state in here that a swap would destroy**, which is a
   narrower thing than "the focus is in here" and the difference was a real freeze.
   Any focus counted, so selecting an account left the focus on the `<select>` that
   had just posted — and `#statusrail`, the region holding that select, was busy
   from then until you clicked somewhere else. The account had changed on the server
   and every subsequent tick skipped the one region that would have said so. Karel,
   2026-08-19: "When I change an account, the information doesn't refresh until I
   reload the page (or go to other)."

   So the test is what the focused control holds rather than where it is. A textarea
   or a text field holds words nobody else has; a slider mid-drag holds a position
   the server has never seen. A checkbox, a radio and a `<select>` hold none — the
   ticks are carried across by `carryState`, and a select's value was posted the
   instant it changed, so the swapped-in copy is the *better* answer. A button holds
   nothing at all.

   `this.blur()` on the two selects is belt to this braces: it also restores the
   focus ring to somewhere sensible after a control replaces itself. */
function holdsUnsavedInput(node) {
  if (!node || node === document.body) { return false; }
  if (node.isContentEditable) { return true; }
  if (node.tagName === "TEXTAREA") { return true; }
  if (node.tagName !== "INPUT") { return false; }
  var kind = (node.type || "text").toLowerCase();
  return ["checkbox", "radio", "button", "submit", "reset"].indexOf(kind) === -1;
}

function regionBusy(region) {
  if (held && region.contains(held)) { return true; }
  var focused = document.activeElement;
  return !!(focused && holdsUnsavedInput(focused) && region.contains(focused));
}

/* Swap one region in place, honouring the three decisions in the header. Returns
   true when it was left alone because something in it is in flight. */
function swapRegion(here, next) {
  if (!here || !next) { return false; }
  if (here.outerHTML === next.outerHTML) { return false; }
  if (regionBusy(here)) { return true; }
  var replacement = next.cloneNode(true);
  carryState(here, replacement);
  here.replaceWith(replacement);
  return false;
}

function sectionsOf(scope) {
  return Array.prototype.slice.call(scope.querySelectorAll("main > section"));
}

function sectionKey(list) {
  return list.map(function (s) { return s.id || "?"; }).join("|");
}

function applyRefresh(html) {
  var fresh = new DOMParser().parseFromString(html, "text/html");

  ["rail", "statusrail"].forEach(function (id) {
    swapRegion(document.getElementById(id), fresh.getElementById(id));
  });

  /* Sections come and go — `sec-lastjob` appears exactly when the newest thing that
     ran wrote no run record, and a run starting or ending changes the set. Matching
     purely by id silently handles neither: a section that vanished would never be
     touched again and would sit there stale forever, and a new one would never be
     inserted because there is nothing here to replace. So the *shape* is checked
     first, and a changed shape is rebuilt wholesale rather than patched. */
  var here = sectionsOf(document);
  var next = sectionsOf(fresh);
  var main = document.querySelector("main");
  if (!main) { return; }

  /* Every page ends with a footer carrying counts, so it goes stale like anything
     else — and it is also the node the rebuild below must insert *before*. */
  var footer = main.querySelector("footer");
  swapRegion(footer, fresh.querySelector("main > footer"));
  footer = main.querySelector("footer");

  if (sectionKey(here) === sectionKey(next)) {
    here.forEach(function (section, i) { swapRegion(section, next[i]); });
    return;
  }
  /* Rebuilding moves nodes the user may be working in, so it waits for them —
     the one case where one busy region holds up the others, and the honest trade:
     half-rebuilding a page whose shape changed would leave it incoherent. */
  if (here.some(regionBusy)) { return; }
  var byId = {};
  here.forEach(function (s) { if (s.id) { byId[s.id] = s; } });
  here.forEach(function (s) { s.remove(); });
  next.forEach(function (s) {
    var replacement = s.cloneNode(true);
    if (s.id && byId[s.id]) { carryState(byId[s.id], replacement); }
    /* Before the footer, never appended past it — `main` is
       statusrail · sections · footer, and appending would put a new section
       underneath the page's closing line. */
    main.insertBefore(replacement, footer);
  });
}

function currentPage() {
  var page = location.pathname.replace(/^\/+|\/+$/g, "");
  return page || "now";
}

/* Only the five rendered pages can refresh: a card, a diff or a log is a document
   that does not change while you read it, and asking the server to re-render one
   would be work nobody asked for. */
var REFRESHABLE = ["now", "verify", "inbox", "ideas", "run", "system"];

function softRefresh() {
  var page = currentPage();
  if (REFRESHABLE.indexOf(page) === -1) { return Promise.resolve(); }
  /* Rescheduled from *here*, not from the timer that called it — an action's own
     `post` refresh 400 ms after a click is a real read of the board, and leaving
     the clock alone would have run another one 400 ms later. The countdown is the
     same clock, so it cannot promise a tick that has already been brought forward. */
  scheduleRefresh(REFRESH_MS);
  return fetch("/api/refresh?page=" + encodeURIComponent(page))
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (html) { if (html) { applyRefresh(html); } })
    .catch(function () { /* the panel was closed, or the box went to sleep: say nothing */ });
}

/* ---- the countdown ------------------------------------------------------

   A page that renews itself silently is a page you cannot tell from a frozen one,
   which is exactly the confusion the account-selector freeze above caused: the
   symptom of a region being skipped and the symptom of nothing having changed are
   the same symptom. Karel, 2026-08-19: "Maybe it should even show some small
   countdown to see, when information will be renewed."

   `setTimeout` chained rather than `setInterval`, because the countdown and the
   refresh have to be one clock. With a fixed interval, any early refresh — every
   successful action triggers one — left the badge counting down to a tick that had
   already happened, and a countdown that lies is worse than none.

   Clicking it refreshes now. Cheap to offer, since that is the same call the timer
   makes, and it is the natural gesture once a number is on screen. */
var nextRefreshAt = 0;

function scheduleRefresh(delay) {
  clearTimeout(window._refreshTimer);
  nextRefreshAt = Date.now() + delay;
  /* Hidden tabs do not poll. Each tick is a board scan plus a couple of `git`
     subprocesses on the server side, and three forgotten tabs would triple that
     forever for nobody's benefit — so a hidden tab re-arms the clock and reads
     nothing, and `visibilitychange` brings it back the moment you return. */
  window._refreshTimer = setTimeout(function () {
    if (document.visibilityState === "visible") { softRefresh(); }
    else { scheduleRefresh(REFRESH_MS); }
  }, delay);
}

function drawTicker() {
  var el = document.getElementById("ticker");
  if (!el) { return; }
  if (REFRESHABLE.indexOf(currentPage()) === -1) { el.hidden = true; return; }
  el.hidden = false;
  if (document.visibilityState !== "visible") {
    el.className = "";
    el.textContent = "paused · tab hidden";
    return;
  }
  var left = Math.ceil((nextRefreshAt - Date.now()) / 1000);
  el.className = left <= 0 ? "now" : "";
  el.textContent = left <= 0 ? "reading the board…" : "refresh in " + left + "s";
}

document.getElementById("ticker").onclick = function () { softRefresh(); };
/* Four times a second, so the number never sits a whole second behind the clock it
   is reporting. It writes one short string into one element outside every swapped
   region, so it costs nothing the refresh has to care about. */
setInterval(drawTicker, 250);

document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") { softRefresh(); }
  drawTicker();
});

scheduleRefresh(REFRESH_MS);
drawTicker();
</script>
</body>
</html>
