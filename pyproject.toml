[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshift"
version = "0.1.0"
description = "The machinery for running a board-driven AI team against a Python repo: gates, hooks, board, preflight, runner."
requires-python = ">=3.11"          # tomllib; the manifest is TOML and reading it must need no dependency
license = { text = "Proprietary" }
# The no-dependency rule is about **bootstrap**, not about the package: a project
# is configured by `.ai/manifest.toml`, and reading that file must never require
# something to be installed first — which `requires-python` above already buys, by
# pinning the version where `tomllib` is stdlib. Past bootstrap, a dependency that
# a gate needs is exactly what belongs here, because the alternative is a step every
# new repo has to remember. `vulture` is the first: `nightshift.gates.dead_code`
# shells out to it, and a real dependency is what makes
# `pip install -e path/to/nightshift` the only step that repo takes. Deliberately
# not an optional extra — an extra is the manual step.
dependencies = ["vulture>=2.16"]
authors = [{ name = "Karel Murgas" }]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

# Two commands, not one per module. `init` runs in a repo that is not configured
# yet and `doctor` is what you reach for before you know what is wrong; every
# other entry point stays `python -m nightshift.<module>`, because a command with
# two spellings is a command three docs will cite differently. See `cli.py`.
[project.scripts]
nightshift = "nightshift.cli:main"

[tool.setuptools.packages.find]
include = ["nightshift*"]

# The templates are data, not code, so `packages.find` does not see them. Without
# this a wheel install ships an `init` that cannot write anything -- the failure
# would be a traceback about a missing file, on the one command a new user runs first.
# `panel_static/*` is the same class of gap for a different command: `panel.py`
# reads `app.html` off disk at request time rather than embedding it as a string,
# so a wheel install without this entry would serve a FileNotFoundError on the
# first page load instead of a traceback about a missing file at import time.
[tool.setuptools.package-data]
nightshift = [
    "templates/*",
    "templates/*/*",
    "templates/*/*/*",
    "templates/*/*/*/*",
    "panel_static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
